<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} · Sal L</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#121016">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="article">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23282828'/%3E%3Ctext x='14' y='68' font-family='monospace' font-size='52' font-weight='bold' fill='%23b8bb26'%3E%26gt;_%3C/text%3E%3C/svg%3E">
  <link rel="alternate" type="application/rss+xml" title="Sal L · Blog" href="../feed.xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/hljs.css">
  <script src="../js/main.js" defer></script>
</head>
<body>
  <div class="window">
    <header class="titlebar">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
      <span class="titlebar-title">sal@cl-d.github.io: ~/blog/{{slug}}</span>
    </header>

    <nav class="tabs" aria-label="Site navigation">
      <a class="tab" href="../index.html">root</a>
      <a class="tab active" href="index.html" aria-current="page">blog</a>
    </nav>

    <main class="screen">
      <p class="crumbs"><a href="../index.html">~</a> / <a href="index.html">blog</a> / {{slug}}</p>

      <article>
        <header class="post-header">
          <h1>{{title}}</h1>
          <div class="post-meta">
            <time datetime="{{date}}">{{date}}</time>
            <span>· {{readingTime}} min read</span>
            {{tags}}
          </div>
        </header>

        <div class="post-content">
{{content}}
        </div>
      </article>

      <p class="back-link"><span class="dollar">$</span> <a href="index.html">cd ~/blog</a> <span class="comment"># back to all posts</span></p>

      <footer>
        <span class="exit"><span class="dollar">$</span> exit 0</span>
        © <span id="year">2026</span> Sal L ·
        built with plain HTML/CSS/JS ·
        deployed by <a href="https://github.com/cl-D/cl-D.github.io/actions" target="_blank" rel="noopener noreferrer">GitHub Actions</a>
      </footer>
    </main>
  </div>
</body>
</html>
